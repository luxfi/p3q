language       = "C"
header         = """
// =============================================================================
// lux/p3q.h - P3Q strict-PQ verifier C ABI
// =============================================================================
//
// Generated by cbindgen from p3q-c-abi. DO NOT EDIT — regenerated on
// every build of the crate.
//
// Linkage:   -lp3q       (cdylib)  on macOS/Linux
//            -lp3q.lib              on Windows
// Headers:   /opt/homebrew/include/lux/p3q.h
//
// SPDX-License-Identifier: Apache-2.0
// Copyright (C) 2024-2026 Lux Industries Inc.
// =============================================================================
"""
include_guard  = "LUX_P3Q_H"
autogen_warning = "// WARNING: regenerated by cbindgen — edits will be lost."
no_includes    = false
sys_includes   = ["stdint.h", "stddef.h"]

[export]
prefix = ""
item_types = ["constants", "globals", "functions"]

[parse]
parse_deps = false
