[package]
name            = "p3q-verifier"
description     = "P3Q strict-PQ STARK+FRI verifier — panic-free, audit-gated."
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true
keywords        = ["stark", "fri", "verifier", "post-quantum"]
categories      = ["cryptography"]

[dependencies]
p3q-core       = { workspace = true }
p3q-field      = { workspace = true }
p3q-fri        = { workspace = true }
p3q-merkle     = { workspace = true }
p3q-sha3       = { workspace = true }
p3q-stark      = { workspace = true }
p3q-recursion  = { workspace = true }
p3q-challenger = { workspace = true }

[features]
default = []
# Enable the toy prover (used by the in-crate golden vector tests). The
# prover compiles ONLY under `cargo test` or with `--features prover`;
# the audited production verifier path does not pull in any of this code.
prover  = []

[lints]
workspace = true
